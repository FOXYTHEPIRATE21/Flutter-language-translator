name: language_translator
description: "A language translator app that translates text from one language to another."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.6.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  translator: ^1.0.3+1
  flutter_launcher_icons: ^0.14.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/languages.png

# The flutter_launcher_icons configuration should be at the root level, not under flutter:
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/languages.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/languages.png"
    background_color: "#1A237E"
    theme_color: "#1A237E"
  windows:
    generate: true
    image_path: "assets/languages.png"
    icon_size: 48
  macos:
    generate: true
    image_path: "assets/languages.png"